name: Build Wii Mod Manager and Publish Release

on:
  push:
    branches: [main]
    paths:
      - "wii/**"
      - ".github/workflows/build-wii.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitppc:latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify Wii toolchain
        run: |
          test -n "$DEVKITPPC"
          test -f "$DEVKITPPC/wii_rules"
          export PATH="$DEVKITPPC/bin:$PATH"
          command -v powerpc-eabi-gcc

      - name: Build Homebrew Channel manager
        run: |
          curl -fsSL https://raw.githubusercontent.com/devkitPro/gamecube-tools/master/elftool/elf2dol.c -o /tmp/elf2dol.c
          cc -O2 -o /tmp/elf2dol /tmp/elf2dol.c
          export PATH="$DEVKITPPC/bin:/tmp:$PATH"
          command -v powerpc-eabi-gcc
          command -v elf2dol
          cd wii
          make -j2
          test -s boot.dol
          test -s meta.xml

      - name: Package Wii manager for SD card
        run: |
          mkdir -p dist/brawl-mod-manager
          cp wii/boot.dol dist/brawl-mod-manager/boot.dol
          cp wii/meta.xml dist/brawl-mod-manager/meta.xml
          cd dist
          zip -r brawl-mod-manager-wii.zip brawl-mod-manager
          test -s brawl-mod-manager-wii.zip

      - name: Keep a short-lived build artifact
        uses: actions/upload-artifact@v4
        with:
          name: brawl-mod-manager-wii-build
          path: |
            wii/boot.dol
            wii/meta.xml
            dist/brawl-mod-manager-wii.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish Wii manager only
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wii-manager-v${{ github.run_number }}
          name: Brawl Mod Manager for Wii ${{ github.run_number }}
          body: |
            Wii Homebrew Channel manager prototype.

            This release contains the Wii manager package only. The Brawl Cloud website and mod library are maintained separately in the repository.

            Important: this is currently a profile-menu prototype. It does not yet download mods or load them inside Brawl.
          prerelease: true
          make_latest: false
          files: |
            wii/boot.dol
            wii/meta.xml
            dist/brawl-mod-manager-wii.zip
