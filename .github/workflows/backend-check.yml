name: Backend checks

on:
  push:
    paths:
      - "backend/**"
      - "cloud/worker/**"
      - ".github/workflows/backend-check.yml"
  pull_request:
    paths:
      - "backend/**"
      - "cloud/worker/**"
      - ".github/workflows/backend-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-backends:
    name: Test local and cloud backends
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test Mac companion backend
        working-directory: backend
        run: npm test
      - name: Test Cloudflare Worker API
        run: node --test cloud/worker/index.test.mjs
